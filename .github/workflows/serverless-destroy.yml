name: "Serverless Infrastructure: Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm teardown"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.13.5"
  TF_STATE_BUCKET: word-manager-serverless-infra-ak
  TF_STATE_KEY: serverless/terraform.tfstate
  TF_VAR_frontend_bucket_name: ${{ vars.FRONTEND_BUCKET_NAME }}

jobs:
  destroy:
    name: "Teardown Serverless Stack"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    defaults:
      run:
        working-directory: serverless/infra/main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SERVERLESS_INFRA_ROLE_ARN }}
          role-session-name: github-actions-serverless-tf-destroy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
